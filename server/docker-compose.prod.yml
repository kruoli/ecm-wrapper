services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      # Bind to 127.0.0.1 so the API is only reachable via nginx on the
      # same host. Docker manipulates iptables directly and bypasses ufw,
      # so "8000:8000" would expose the port even with a firewall.
      - "127.0.0.1:8000:8000"
    environment:
      ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      # Security keys read from secret files
      SECRET_KEY_FILE: /run/secrets/api_secret_key
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
    volumes:
      - residue_data:/app/data/residues
    secrets:
      - database_url
      - api_secret_key
      - admin_api_key
    restart: unless-stopped

volumes:
  residue_data:

secrets:
  database_url:
    file: ./secrets/database_url.txt
  api_secret_key:
    file: ./secrets/api_secret_key.txt
  admin_api_key:
    file: ./secrets/admin_api_key.txt