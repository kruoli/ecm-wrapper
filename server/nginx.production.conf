# Production nginx site config for ecm.kyleaskine.com
# Deployed at: /etc/nginx/sites-available/ecm
# This is a sites-available fragment — it lives inside the system nginx
# http{} block, not a standalone nginx.conf. For the docker-compose /
# template version of the full config, see nginx.conf.

server {
    listen 80;
    server_name ecm.kyleaskine.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecm.kyleaskine.com;

    ssl_certificate /etc/letsencrypt/live/ecm.kyleaskine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecm.kyleaskine.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must be >= FastAPI's residue upload cap (50 MB in app/api/v1/residues.py)
    # so FastAPI returns the real error instead of nginx 413.
    client_max_body_size 100M;

    location /downloads/ {
        alias /var/www/ecm-downloads/;
        # Optional: force download instead of displaying in browser
        add_header Content-Disposition 'attachment';
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 10;
    }
}
